name: Cross-platform Jekyll Build

on:
  push:
    branches: [main]
    paths:
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.js'
      - '.github/workflows/jekyll_windows.yml'
  pull_request:
    paths:
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.js'
      - '.github/workflows/jekyll_windows.yml'
  workflow_dispatch:

concurrency:
  group: platform-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows image build dependencies
        if: runner.os == 'Windows'
        run: choco install graphicsmagick imagemagick --yes --no-progress
      - name: Install Linux image build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphicsmagick imagemagick
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build site
        run: npx gulp build
        env:
          JEKYLL_ENV: production
      - name: Check generated hyperlinks
        run: python scripts/check_relative_links.py _site
