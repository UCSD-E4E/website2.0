name: Cross-platform Jekyll Build

on:
  push:
    branches: [main]
    paths:
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.js'
      - 'scripts/image-cache.cjs'
      - 'scripts/test_image_cache.cjs'
      - 'scripts/test_image_cache_integration.rb'
      - '.github/workflows/jekyll_windows.yml'
      - 'VERSION'
      - '_plugins/site_version.rb'
      - '_includes/footer.html'
      - 'scripts/test_site_version.rb'
      - '_config.yml'
  pull_request:
    paths:
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.js'
      - 'scripts/image-cache.cjs'
      - 'scripts/test_image_cache.cjs'
      - 'scripts/test_image_cache_integration.rb'
      - '.github/workflows/jekyll_windows.yml'
      - 'VERSION'
      - '_plugins/site_version.rb'
      - '_includes/footer.html'
      - 'scripts/test_site_version.rb'
      - '_config.yml'
  workflow_dispatch:

concurrency:
  group: platform-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Cold Windows image builds can exceed 20 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows image build dependencies
        if: runner.os == 'Windows'
        run: |
          choco install graphicsmagick imagemagick --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path "$env:ProgramFiles\ImageMagick*", "$env:ProgramFiles\GraphicsMagick*" -Directory |
            ForEach-Object { $_.FullName } |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux image build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphicsmagick imagemagick
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check website version rendering
        run: bundle exec ruby scripts/test_site_version.rb
      - name: Check image cache recovery
        run: node --test scripts/test_image_cache.cjs
      - name: Check image reuse with Jekyll
        run: bundle exec ruby scripts/test_image_cache_integration.rb
      - name: Build site
        run: npx gulp build
        env:
          JEKYLL_ENV: production
      - name: Check generated hyperlinks
        run: python scripts/check_relative_links.py _site
