name: Automatic website version

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Activation requires the App/branch-rule setup documented in README.md.
permissions:
  contents: read

# Reconcile main's actual commit order, rather than trusting event arrival order.
# Full queues preserve bursts; reconciliation also catches up after missed runs.
concurrency:
  group: website-version
  queue: max

jobs:
  version:
    if: vars.AUTO_VERSIONING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Test versioning before updating metadata
        run: python3 -m unittest discover -s scripts -p 'test_auto_version.py'
      - name: Record merged PR versions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          python3 scripts/auto_version.py publish
