# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Build on GitHub and publish to Jacobs hosting through the campus runner.
name: Deploy E4E website

on:
  # Runs on pushes targeting the default branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Build checkout; the publish job separately grants artifact access.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.ref }}
  # Branches: a new push cancels the old build. main: QUEUE instead, because a cancelled
  # deploy job abandons a publish that's still running on the slot.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # v1.161.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Setup build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphicsmagick imagemagick
          npm ci
      - name: Identify image processing tools
        id: image-toolchain
        shell: bash
        run: |
          fingerprint=$({ gm version; convert -version; } | sha256sum | cut -d ' ' -f 1)
          echo "version=$fingerprint" >> "$GITHUB_OUTPUT"
      # Separate snapshots let template-only changes add variants. The plugin's
      # content/settings hashes reuse unchanged images from the latest snapshot.
      - name: Restore processed images
        id: image-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            cache/resize
            cache/resize_temp
          key: images-v1-${{ runner.os }}-${{ steps.image-toolchain.outputs.version }}-${{ hashFiles('Gemfile.lock', 'scripts/image-cache.cjs') }}-${{ github.sha }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ steps.image-toolchain.outputs.version }}-${{ hashFiles('Gemfile.lock', 'scripts/image-cache.cjs') }}-
      - name: Check image cache recovery
        run: node --test scripts/test_image_cache.cjs
      - name: Checks Ruby Gems
        run: bundle list
      - name: Checks npm packages
        run: npm list
      # - name: Setup Pages
      #   id: pages
      #   uses: actions/configure-pages@v4
      - name: Check component style placement
        run: bundle exec ruby scripts/test_page_styles.rb
      - name: Check website version rendering
        run: bundle exec ruby scripts/test_site_version.rb
      - name: Check image reuse with Jekyll
        run: bundle exec ruby scripts/test_image_cache_integration.rb
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        id: build
        run: npx gulp build
        env:
          JEKYLL_ENV: production
      - name: Check hyperlink paths
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_relative_links.py _site
      - name: Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site" #--enforce_https false <-- why doesn't this work?
          arguments: --ignore-status-codes "999,403" --ignore_urls "/datascience.ucsd.edu/,/kastner.ucsd.edu/,/onlinedigeditions.com/,/e4e.ucsd.edu/,/jaffeweb.ucsd.edu/,/instagram.com/" --assume-extension .html --swap-urls '^https\://e4e.ucsd.edu/:/'
      - name: Checks files
        run: ls -l cache
      - name: Checks files
        run: ls -l assets
      # The publish stamp (was written on kastner-ml by _deploy_e4e-dev.sh).
      - name: Stamp the build
        if: github.ref == 'refs/heads/main'
        run: |
          {
            printf 'Version: %s\n' "$(cat VERSION)"
            date -u '+Deployed: %Y-%m-%dT%H:%M:%SZ'
            echo "Commit: ${{ github.sha }}"
          } > _site/last_deployed.txt
      # Handed to the `deploy` job on the publish slot. include-hidden-files: _site has
      # .htaccess, and upload-artifact@v4 drops dotfiles by default.
      - name: Upload the built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save processed images
        uses: actions/cache/save@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.image-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            cache/resize
            cache/resize_temp
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
  # Publish on the krg-nat Incus slot `e4e-website`: a campus host, which mywebsite's
  # SSH requires. The runner stages the artifact and starts `e4e-website-publish`. That
  # unit holds the SSH key and rsyncs to e4e@mywebsite.eng.ucsd.edu:htdocs/ (the slot's
  # deploy/incus/publish.nix). No secrets in this repo: the key lives in the lab's
  # OpenBao and never reaches this job.
  deploy:
    runs-on: [self-hosted, e4e-website]
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read # download the artifact
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      STAGING: /var/lib/e4e-website/staging
    steps:
      # A publish can outlive its job (a manually cancelled run leaves the unit
      # running), so never touch staging while one is in flight.
      - name: Wait for any in-flight publish
        run: |
          for i in $(seq 1 60); do
            state=$(systemctl show e4e-website-publish.service -p ActiveState --value)
            case "$state" in
              active|activating|deactivating|reloading) ;;
              inactive|failed) exit 0 ;;
              *) echo "::error::Unexpected publish state: $state"; exit 1 ;;
            esac
            echo "[$i/60] a publish is still running..."
            sleep 10
          done
          echo "::error::e4e-website-publish has been running for 10 minutes; check it on the slot"
          exit 1
      - name: Clear the download area
        run: rm -rf -- "$STAGING/incoming"
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ env.STAGING }}/incoming
      # Only a COMPLETE download becomes the site the unit publishes. The runner's umask
      # is 0066 and the publish unit runs as a different user, hence the chmod.
      - name: Swap it into place
        run: |
          chmod -R a+rX "$STAGING/incoming"
          rm -rf -- "$STAGING/site"
          mv -- "$STAGING/incoming" "$STAGING/site"
      - name: Publish
        run: systemctl start e4e-website-publish.service # polkit-authorized on the slot
      - name: Publish log
        if: always()
        run: cat /run/e4e-website-publish/log || true
