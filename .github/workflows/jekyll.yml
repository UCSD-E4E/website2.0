# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.ref }}
  # Branches: a new push cancels the old build. main: QUEUE instead, because a cancelled
  # deploy job abandons a publish that's still running on the slot.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: make caches
        run: |
          mkdir cache
          mkdir cache/resize
      - name: Cache Images
        uses: actions/cache/restore@v3
        with:
          path: cache
          key: cache_test-${{ hashFiles('assets/**') }}
          restore-keys: |
            cache_test
      - name: check cache
        run: |
          ls -l cache
          ls -l cache/resize
      - name: Setup node
        uses: actions/setup-node@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # v1.161.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Setup build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install graphicsmagick
          npm ci
      - name: Checks Ruby Gems
        run: bundle list
      - name: Checks npm packages
        run: npm list
      # - name: Setup Pages
      #   id: pages
      #   uses: actions/configure-pages@v4
      - name: Check component style placement
        run: bundle exec ruby scripts/test_page_styles.rb
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        id: build
        run: npx gulp build
        env:
          JEKYLL_ENV: production
      - name: Check hyperlink paths
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_relative_links.py _site
      - name: Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site" #--enforce_https false <-- why doesn't this work?
          arguments: --ignore-status-codes "999,403" --ignore_urls "/datascience.ucsd.edu/,/kastner.ucsd.edu/,/onlinedigeditions.com/,/e4e.ucsd.edu/,/jaffeweb.ucsd.edu/,/instagram.com/" --assume-extension .html --swap-urls '^https\://e4e.ucsd.edu/:/'
      - name: Checks files
        run: ls -l cache
      - name: Checks files
        run: ls -l assets
      - name: remove extra cache
        if: steps.build.outcome == 'success'
        run: rm -rf cache/resize_temp
      # The publish stamp (was written on kastner-ml by _deploy_e4e-dev.sh).
      - name: Stamp the build
        if: github.ref == 'refs/heads/main'
        run: |
          {
            date -u '+Deployed: %Y-%m-%dT%H:%M:%SZ'
            echo "Commit: ${{ github.sha }}"
          } > _site/last_deployed.txt
      # Handed to the `deploy` job on the publish slot. include-hidden-files: _site has
      # .htaccess, and upload-artifact@v4 drops dotfiles by default.
      - name: Upload the built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Cache Images
        uses: actions/cache/save@v3
        if: always()
        with:
          path: cache
          # this should not hash every file.... how do we connect this to a new cache?
          key: cache_test-${{ hashFiles('assets/**') }}
  # Publish on the krg-nat Incus slot `e4e-website`: a campus host, which mywebsite's
  # SSH requires. The runner stages the artifact and starts `e4e-website-publish`. That
  # unit holds the SSH key and rsyncs to e4e@mywebsite.eng.ucsd.edu:htdocs/ (the slot's
  # deploy/incus/publish.nix). No secrets in this repo: the key lives in the lab's
  # OpenBao and never reaches this job.
  deploy:
    runs-on: [self-hosted, e4e-website]
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read # download the artifact
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      STAGING: /var/lib/e4e-website/staging
    steps:
      # A publish can outlive its job (a manually cancelled run leaves the unit
      # running), so never touch staging while one is in flight.
      - name: Wait for any in-flight publish
        run: |
          for i in $(seq 1 60); do
            systemctl is-active --quiet e4e-website-publish.service || exit 0
            echo "[$i/60] a publish is still running..."
            sleep 10
          done
          echo "::error::e4e-website-publish has been running for 10 minutes; check it on the slot"
          exit 1
      - name: Clear the download area
        run: rm -rf -- "$STAGING/incoming"
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ env.STAGING }}/incoming
      # Only a COMPLETE download becomes the site the unit publishes. The runner's umask
      # is 0066 and the publish unit runs as a different user, hence the chmod.
      - name: Swap it into place
        run: |
          chmod -R a+rX "$STAGING/incoming"
          rm -rf -- "$STAGING/site"
          mv -- "$STAGING/incoming" "$STAGING/site"
      - name: Publish
        run: systemctl start e4e-website-publish.service # polkit-authorized on the slot
      - name: Publish log
        if: always()
        run: cat /run/e4e-website-publish/log || true


