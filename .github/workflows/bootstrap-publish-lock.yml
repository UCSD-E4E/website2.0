name: Validate publish handoff and generate initial lock
on:
  push:
    branches: [feat/website-publish-slot]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock
      - name: Evaluate publisher configuration
        run: nix eval --raw .#nixosConfigurations.e4e-website.config.system.build.toplevel.drvPath
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1
