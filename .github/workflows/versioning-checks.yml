name: Website versioning checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - scripts/auto_version.py
      - scripts/test_auto_version.py
      - .github/workflows/auto-version.yml
      - .github/workflows/versioning-checks.yml

permissions:
  contents: read

jobs:
  test:
    name: Website version policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test version ordering, retry safety, and push races
        run: python3 -m unittest discover -s scripts -p 'test_auto_version.py'
      - name: Validate version labels
        if: github.event_name == 'pull_request'
        run: python3 scripts/auto_version.py validate-labels
